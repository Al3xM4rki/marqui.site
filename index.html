<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>al3xm4rki</title>
<meta name="description" content="al3xm4rki — portfolio.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Set theme before first paint: saved choice, else the OS preference.
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>

<header class="topbar">
  <a class="crumb" href="/">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
      <rect x="1" y="1" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="4" y="10" width="5" height="2" fill="currentColor"/>
    </svg>
    <span>/ home</span>
  </a>
  <nav class="dock" id="dock" aria-label="Shortcuts">
    <button type="button" class="dock__item" data-cmd="help">
      <kbd class="dock__icon">?</kbd><span class="dock__tip">Help</span>
    </button>
    <button type="button" class="dock__item" data-cmd="clear">
      <kbd class="dock__icon">⌃+L</kbd><span class="dock__tip">Clear</span>
    </button>
    <button type="button" class="dock__item" data-cmd="theme">
      <svg class="dock__svg icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="dock__svg icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <span class="dock__tip"><span id="theme-label">Light mode</span> <span class="dock__key">⌃+M</span></span>
    </button>
  </nav>
</header>

<main class="shell" id="shell">
  <h1 class="title">
    <span class="name">al3xm4rki</span>
  </h1>

  <pre class="dump" id="dump" aria-hidden="true"></pre>

  <div class="log" id="log" aria-live="polite"></div>

  <div class="prompt" id="prompt">
    <span class="ps1">~ $</span><span class="typed" id="typed"></span>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type a command, for example help">
  </div>

  <p class="hint">
    try
    <button type="button" data-cmd="whoami">whoami</button>
    <button type="button" data-cmd="ls">ls</button>
    <button type="button" data-cmd="projects">projects</button>
    <button type="button" data-cmd="writeups">writeups</button>
    <button type="button" data-cmd="contact">contact</button>
  </p>

  <noscript>
    <p class="noscript">al3xm4rki. Find me on <a href="https://github.com/Al3xM4rki">GitHub</a>.</p>
  </noscript>
</main>

<script src="main.js"></script>
</body>
</html>
