<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>al3xm4rki</title>
<meta name="description" content="Portfolio de al3xm4rki">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0a06;
    --panel:#15100a;
    --amber:#ffb000;
    --amber-dim:#a3701a;
    --amber-hot:#ffe4b0;
    --cyan:#5fd7c8;
    --glow:0 0 4px rgba(255,176,0,.55), 0 0 18px rgba(255,140,0,.22);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--amber);
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:15px;
    line-height:1.7;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }
  /* rejilla de líneas de barrido + viñeta del tubo */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:3;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,.28) 0px, rgba(0,0,0,.28) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode:multiply;
  }
  body::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:4;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%);
  }

  .term{
    width:min(720px,100%);
    background:var(--panel);
    border:1px solid #33240f;
    border-radius:3px;
    box-shadow:0 0 0 1px #0a0704, 0 24px 80px rgba(0,0,0,.7);
    position:relative; z-index:2;
  }
  .bar{
    display:flex; align-items:center; gap:10px;
    padding:9px 14px;
    border-bottom:1px solid #33240f;
    color:var(--amber-dim);
    font-size:12px;
    letter-spacing:.04em;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#3d2c12;flex:none}
  .dot.live{background:var(--amber);box-shadow:0 0 8px var(--amber)}

  .screen{padding:28px 22px 34px;text-shadow:var(--glow)}
  .line{margin:0 0 4px}
  .prompt{color:var(--amber-dim)}
  .prompt::before{content:"$ ";color:var(--cyan)}

  h1{
    font-family:"VT323",monospace;
    font-weight:400;
    font-size:clamp(3.4rem,15vw,7.5rem);
    line-height:.92;
    margin:14px 0 22px;
    color:var(--amber-hot);
    letter-spacing:.01em;
    text-shadow:0 0 6px rgba(255,176,0,.8), 0 0 30px rgba(255,120,0,.35);
    word-break:break-word;
  }
  .out{margin:0 0 18px;color:var(--amber);max-width:62ch}
  .out a{color:var(--cyan);text-decoration:none;border-bottom:1px dotted currentColor}
  .out a:hover,.out a:focus-visible{color:var(--amber-hot);border-bottom-style:solid}
  a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

  .cursor{
    display:inline-block;
    width:.58em;height:1.05em;
    background:var(--amber-hot);
    vertical-align:-2px;
    box-shadow:0 0 10px var(--amber);
    animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .hidden{visibility:hidden}

  @media (prefers-reduced-motion:reduce){
    .cursor{animation:none}
  }
  @media (max-width:480px){
    .screen{padding:20px 16px 26px}
    body{padding:12px}
  }
</style>
</head>
<body>

<main class="term">
  <div class="bar">
    <span class="dot live" aria-hidden="true"></span>
    <span class="dot" aria-hidden="true"></span>
    <span class="dot" aria-hidden="true"></span>
    <span>marqui.site</span>
  </div>

  <div class="screen">
    <p class="line prompt">whoami</p>
    <h1>al3xm4rki</h1>

    <p class="line prompt">cat sobre.txt</p>
    <p class="out" id="about"></p>

    <p class="line prompt">status --deploy</p>
    <p class="out" id="status"></p>

    <p class="line prompt"><span class="cursor" aria-hidden="true"></span></p>
  </div>
</main>

<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var blocks = [
    { el: document.getElementById('about'),
      text: 'Portfolio en construcción. Pronto aquí: proyectos, writeups y formas de contacto.' },
    { el: document.getElementById('status'),
      text: 'Servido desde Cloudflare Pages · HTTPS activo · si lees esto, el despliegue funciona.' }
  ];

  if (reduce) {
    blocks.forEach(function (b) { b.el.textContent = b.text; });
    return;
  }

  function type(i) {
    if (i >= blocks.length) return;
    var b = blocks[i], n = 0;
    var timer = setInterval(function () {
      b.el.textContent = b.text.slice(0, ++n);
      if (n >= b.text.length) {
        clearInterval(timer);
        setTimeout(function () { type(i + 1); }, 320);
      }
    }, 18);
  }
  type(0);
})();
</script>

</body>
</html>
